apiVersion: v1
kind: Service
metadata:
  name: health-backend
  namespace: health
  labels:
    app: health-backend
    app.kubernetes.io/name: health-backend
    app.kubernetes.io/component: backend
spec:
  selector:
    app: health-backend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 5001
  type: ClusterIP
