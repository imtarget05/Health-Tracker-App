apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: health-ai-production
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: health-tracker
    environment: production
  finalizers:
    - resources-finalizer.argocd.io
  annotations:
    notifications.argoproj.io/subscribe.on-sync-succeeded.slack: deployments
    notifications.argoproj.io/subscribe.on-sync-failed.slack: deployments
spec:
  project: health-tracker

  source:
    repoURL: https://gitlab.com/YOUR_GROUP/health-tracker-app.git # replace with your repo URL
    targetRevision: main
    path: k8s/overlays/production

  destination:
    server: https://kubernetes.default.svc
    namespace: health

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/metadata/annotations/kubectl.kubernetes.io~1last-applied-configuration

  revisionHistoryLimit: 10
