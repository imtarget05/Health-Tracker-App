apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: health-backend-staging
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: health-tracker
    environment: staging
  finalizers:
    - resources-finalizer.argocd.io
spec:
  project: health-tracker

  source:
    repoURL: https://gitlab.com/YOUR_GROUP/health-tracker-app.git # replace with your repo URL
    targetRevision: develop
    path: k8s/overlays/staging

  destination:
    server: https://kubernetes.default.svc
    namespace: health-staging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  revisionHistoryLimit: 5
